[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iadd_mesa_binary"
version = "0.4.11"
authors = [
    {name="Nicholas Hurst", email="njhurst2@illinois.edu"}
]
description = "Library for reading and plotting data from iADD's MESA Binary tool"
readme = "README.txt"
license = "GPL-2.0-only"
requires-python = ">=3.8"

dependencies = [
    "numpy",
    "mesaPlot",
    "matplotlib",
    "PyAstronomy",
    "astro-tulips",
    "scipy",
    "moviepy",
    "mesa-reader",
]